name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Fetch CJK font
        run: python scripts/fetch_font.py

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: libs/arm64-v8a/libffmpeg.so
          key: ffmpeg-n7.1-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Build static FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh

      - name: Prefetch SDL sources
        run: |
          set -e
          BASE=.buildozer/android/platform/build-arm64-v8a/packages
          fetch() {
            recipe="$1"
            url="$2"
            file="$3"
            dir="$BASE/$recipe"
            mkdir -p "$dir"
            curl -L --retry 10 --retry-all-errors --max-time 300 -o "$dir/$file" "$url"
            touch "$dir/.mark-$file"
            ls -lh "$dir/$file"
          }
          fetch sdl2 https://libsdl.org/release/SDL2-2.30.11.tar.gz SDL2-2.30.11.tar.gz
          fetch sdl2_image https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.8.2.tar.gz SDL2_image-2.8.2.tar.gz
          fetch sdl2_mixer https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz SDL2_mixer-2.6.3.tar.gz
          fetch sdl2_ttf https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.22.0.tar.gz SDL2_ttf-2.22.0.tar.gz

      - name: Prefetch Gradle distribution
        run: |
          set -e
          DIR="$HOME/.gradle/wrapper/dists/gradle-8.14.3-all/10utluxaxniiv4wxiphsi49nj"
          mkdir -p "$DIR"
          ZIP="$DIR/gradle-8.14.3-all.zip"
          if [ ! -s "$ZIP" ]; then
            for url in \
              https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip \
              https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-all.zip; do
              echo "Downloading $url"
              if curl -L --retry 10 --retry-all-errors --max-time 900 -o "$ZIP" "$url"; then
                break
              fi
            done
          fi
          test -s "$ZIP"
          cp "$ZIP" "$HOME/gradle-8.14.3-all.zip"
          mkdir -p "$HOME/.gradle"
          if [ -f "$HOME/.gradle/gradle.properties" ]; then
            sed -i '/^org.gradle.java.home=/d' "$HOME/.gradle/gradle.properties"
          fi
          echo "org.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$HOME/.gradle/gradle.properties"
          ls -lh "$ZIP" "$HOME/gradle-8.14.3-all.zip"

      - name: Build debug APK
        run: |
          set -e
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          PROP=.buildozer/android/platform/build-arm64-v8a/dists/universalvideodownloader/gradle/wrapper/gradle-wrapper.properties
          (
            for i in $(seq 1 600); do
              if [ -f "$PROP" ]; then
                sed -i 's|^distributionUrl=.*|distributionUrl=file\:/home/runner/gradle-8.14.3-all.zip|' "$PROP"
                echo "Patched $PROP"
                cat "$PROP"
                break
              fi
              sleep 2
            done
          ) &
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalVideoDownloader-debug
          path: bin/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} bin/*.apk --generate-notes
